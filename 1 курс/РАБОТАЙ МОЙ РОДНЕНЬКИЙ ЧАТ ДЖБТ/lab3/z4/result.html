<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Unit Converter</title>
    
    <style>
        /* Base Reset */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            line-height: 1.5;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 2rem 1rem;
        }

        /* Header Styles */
        header {
            text-align: center;
            margin-bottom: 2rem;
            max-width: 800px;
        }

        header h1 {
            color: #ffffff;
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        header p {
            color: #9e9e9e;
        }

        /* Main Card Styles */
        main {
            background-color: #1e1e1e;
            width: 100%;
            max-width: 800px;
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        section {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        section h2 {
            color: #3b82f6;
            font-size: 1.2rem;
            border-bottom: 1px solid #333333;
            padding-bottom: 0.5rem;
            margin-bottom: 0.5rem;
        }

        /* Form Controls */
        label {
            font-size: 0.95rem;
            color: #bdbdbd;
            font-weight: 500;
        }

        input[type="number"],
        select {
            width: 100%;
            padding: 0.8rem 1rem;
            background-color: #2a2a2a;
            border: 1px solid #444444;
            border-radius: 8px;
            color: #ffffff;
            font-size: 1rem;
            transition: all 0.2s ease;
            appearance: none;
        }

        select {
            background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23bdbdbd%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
            background-repeat: no-repeat;
            background-position: right 1rem top 50%;
            background-size: 0.65rem auto;
        }

        input[type="number"]:focus,
        select:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        /* Radio Buttons layout */
        .radio-section {
            display: grid;
            grid-template-columns: min-content 1fr;
            align-items: center;
            row-gap: 0.75rem;
            column-gap: 0.5rem;
        }

        .radio-section h2 {
            grid-column: 1 / -1;
            margin-bottom: 0;
        }

        input[type="radio"] {
            accent-color: #3b82f6;
            width: 1.2rem;
            height: 1.2rem;
            cursor: pointer;
        }

        .radio-section label {
            cursor: pointer;
        }

        /* Button */
        button {
            background-color: #3b82f6;
            color: #ffffff;
            font-size: 1.1rem;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            padding: 1rem;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
            width: 100%;
        }

        button:hover {
            background-color: #2563eb;
        }

        button:active {
            transform: translateY(2px);
        }

        /* Result and Error Containers */
        #result-container {
            background-color: #2a2a2a;
            padding: 1.5rem;
            border-radius: 8px;
            border-left: 4px solid #3b82f6;
        }

        #result-output {
            color: #ffffff;
            font-size: 1.3rem;
            display: block;
            margin-top: 0.5rem;
            word-break: break-all;
        }

        #error-container {
            background-color: #3f1a1a;
            padding: 1rem;
            border-radius: 8px;
            border-left: 4px solid #ef4444;
            color: #fca5a5;
            margin-bottom: 1rem;
        }

        #error-container[hidden] {
            display: none;
        }

        /* Footer */
        footer {
            margin-top: auto;
            padding-top: 2rem;
            color: #757575;
            font-size: 0.9rem;
        }

        /* Desktop Adaptive Grid Layout */
        @media (min-width: 768px) {
            main {
                display: grid;
                grid-template-columns: 1fr 1fr;
                grid-template-areas: 
                    "input-section input-section"
                    "radio-section result-section"
                    "action-section result-section";
                align-items: start;
                column-gap: 2.5rem;
                row-gap: 2rem;
            }

            .input-section { grid-area: input-section; }
            .radio-section { grid-area: radio-section; }
            .action-section { grid-area: action-section; align-self: end; }
            .result-section { grid-area: result-section; height: 100%; margin: 0; }

            /* Horizontal inputs on desktop */
            .input-section {
                display: grid;
                grid-template-columns: auto 1fr;
                align-items: center;
                column-gap: 1rem;
                row-gap: 1.5rem;
            }

            .input-section h2 {
                grid-column: 1 / -1;
            }

            .result-section {
                display: flex;
                flex-direction: column;
            }

            #result-container {
                flex-grow: 1;
                display: flex;
                flex-direction: column;
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>Data Unit Converter</h1>
        <p>Quickly convert between bits, bytes, and multiples.</p>
    </header>

    <main>
        <!-- Input Section -->
        <section class="input-section">
            <h2>Input Data</h2>
            
            <label for="value-input">Amount:</label>
            <input type="number" id="value-input" placeholder="Enter number" min="0" step="any">

            <label for="from-unit">From unit:</label>
            <select id="from-unit">
                <option value="bit">Bit (b)</option>
                <option value="byte">Byte (B)</option>
                <option value="kb">Kilobyte (KB)</option>
                <option value="mb">Megabyte (MB)</option>
                <option value="gb">Gigabyte (GB)</option>
                <option value="tb">Terabyte (TB)</option>
            </select>

            <label for="to-unit">To unit:</label>
            <select id="to-unit">
                <option value="bit">Bit (b)</option>
                <option value="byte">Byte (B)</option>
                <option value="kb" selected>Kilobyte (KB)</option>
                <option value="mb">Megabyte (MB)</option>
                <option value="gb">Gigabyte (GB)</option>
                <option value="tb">Terabyte (TB)</option>
            </select>
        </section>

        <!-- Unit System Section -->
        <section class="radio-section">
            <h2>Calculation System</h2>
            
            <input type="radio" id="base-binary" name="base-toggle" value="1024" checked>
            <label for="base-binary">Binary (1 KB = 1024 Bytes)</label>
            
            <input type="radio" id="base-decimal" name="base-toggle" value="1000">
            <label for="base-decimal">Decimal (1 KB = 1000 Bytes)</label>
        </section>

        <!-- Action Section -->
        <section class="action-section">
            <button type="button" id="convert-btn">Convert</button>
        </section>

        <!-- Result and Error Section -->
        <section class="result-section">
            <h2>Result</h2>
            
            <!-- Error messages block -->
            <div id="error-container" hidden>
                <p><strong>Error:</strong> <span id="error-message"></span></p>
            </div>

            <!-- Successful result block -->
            <div id="result-container">
                <p>Final value: <strong id="result-output">-</strong></p>
            </div>
        </section>
    </main>

    <footer>
        <p>Data Unit Converter Application</p>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            
            // Get all interactive elements by their IDs
            const convertBtn = document.getElementById('convert-btn');
            const valueInputEl = document.getElementById('value-input');
            const fromUnitEl = document.getElementById('from-unit');
            const toUnitEl = document.getElementById('to-unit');
            const errorContainerEl = document.getElementById('error-container');
            const errorMessageEl = document.getElementById('error-message');
            const resultOutputEl = document.getElementById('result-output');
            const resultContainerEl = document.getElementById('result-container');

            convertBtn.addEventListener('click', function() {
                
                // 1. Clear previous errors and warnings
                errorContainerEl.hidden = true;
                errorMessageEl.textContent = '';
                resultOutputEl.textContent = '-';
                
                // Remove existing warning note if it exists
                const existingWarning = document.getElementById('warning-message');
                if (existingWarning) {
                    existingWarning.remove();
                }

                // 2. Read values
                const inputValue = valueInputEl.value.trim();
                const numValue = parseFloat(inputValue);
                const fromUnit = fromUnitEl.value;
                const toUnit = toUnitEl.value;
                
                // Read the calculation system (1000 or 1024)
                const checkedRadio = document.querySelector('input[name="base-toggle"]:checked');
                const baseMultiplier = checkedRadio ? parseInt(checkedRadio.value) : 1024;

                // 3. Validation and Protection
                if (inputValue === '' || isNaN(numValue)) {
                    showError('Please enter a valid numeric value.');
                    return;
                }
                
                if (numValue < 0) {
                    showError('Value cannot be negative.');
                    return;
                }
                
                if (!fromUnit || !toUnit) {
                    showError('Please select both source and target units.');
                    return;
                }

                // Protection: Prevent conversion if units are identical
                if (fromUnit === toUnit) {
                    showError('Source and target units cannot be identical. Please select different units.');
                    return;
                }

                // Unit map: tracks if it uses bytes and its power exponent
                const unitDict = {
                    'bit':  { isByte: false, exp: 0 },
                    'byte': { isByte: true,  exp: 0 },
                    'kb':   { isByte: true,  exp: 1 },
                    'mb':   { isByte: true,  exp: 2 },
                    'gb':   { isByte: true,  exp: 3 },
                    'tb':   { isByte: true,  exp: 4 }
                };

                const sourceConfig = unitDict[fromUnit];
                const targetConfig = unitDict[toUnit];

                if (!sourceConfig || !targetConfig) {
                    showError('System error: Invalid unit selected.');
                    return;
                }

                // 4. Conversion Logic
                let totalBits = numValue;
                if (sourceConfig.isByte) {
                    totalBits = numValue * 8 * Math.pow(baseMultiplier, sourceConfig.exp);
                }

                let finalResult = totalBits;
                if (targetConfig.isByte) {
                    finalResult = totalBits / (8 * Math.pow(baseMultiplier, targetConfig.exp));
                }

                // 5. Output Formatting & Safe Limits Protection
                let formattedResult;
                let showWarning = false;

                // Protection: Check if value exceeds safe integer limits
                if (finalResult > Number.MAX_SAFE_INTEGER || numValue > Number.MAX_SAFE_INTEGER) {
                    formattedResult = finalResult.toExponential(4);
                    showWarning = true;
                } else {
                    // Round to 4 decimal places to avoid garbage zeroes
                    let roundedResult = parseFloat(finalResult.toFixed(4));
                    
                    // If the value is so small that toFixed(4) makes it 0, but it is actually > 0,
                    // fall back to exponential notation to avoid losing the data.
                    if (roundedResult === 0 && finalResult > 0) {
                        formattedResult = finalResult.toExponential(4);
                    } else {
                        formattedResult = roundedResult.toString();
                    }
                }

                // 6. Output the result
                resultOutputEl.textContent = formattedResult;

                // Inject warning footnote dynamically if needed
                if (showWarning) {
                    const warningEl = document.createElement('p');
                    warningEl.id = 'warning-message';
                    warningEl.style.color = '#fbbf24'; 
                    warningEl.style.fontSize = '0.85rem';
                    warningEl.style.marginTop = '0.75rem';
                    warningEl.textContent = '* Note: The value exceeds the JavaScript safe integer limit. Precision loss may occur.';
                    
                    resultContainerEl.appendChild(warningEl);
                }
            });

            // Helper function to display errors
            function showError(msg) {
                errorMessageEl.textContent = msg;
                errorContainerEl.hidden = false;
            }
        });
    </script>
</body>
</html>
